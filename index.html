<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, interactive-widget=resizes-content" />
    
    <!-- Site-wide meta. Title, description, robots, canonical, hreflang and the
         per-page Open Graph / Twitter fields are set per route by
         src/components/Seo.tsx and rendered into each prerendered page. -->
    <meta name="author" content="Simplia Spain" />
    <meta name="keywords" content="agente de IA WhatsApp, WhatsApp coworking, centro de negocios, oficinas flexibles, reserva de visitas, despachos, agente de IA para coworking, España" />
    <meta name="language" content="es" />
    <meta name="geo.region" content="ES" />
    <meta name="geo.placename" content="España" />

    <!-- Open Graph / Facebook -->
    <meta property="og:type" content="website" />
    <meta property="og:image" content="https://www.simpliaspain.com/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:image:alt" content="Simplia Spain - Agente de IA de WhatsApp para coworkings" />
    <meta property="og:locale" content="es_ES" />
    <meta property="og:site_name" content="Simplia Spain" />

    <!-- Twitter -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="https://www.simpliaspain.com/og-image.png" />
    <meta name="twitter:creator" content="@simpliaspain" />

    <!-- Icons: white S on brand blue, generated in public/. The SVG is what
         modern browsers use; the ICO (16/32/48) is the fallback; iOS needs a
         real PNG for the home-screen icon. icon-192/512.png exist for a web
         manifest, which this site does not have yet. -->
    <link rel="icon" href="/favicon.ico" sizes="48x48" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="icon" type="image/png" sizes="96x96" href="/favicon-96x96.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    
    <!-- Theme Color -->
    <meta name="theme-color" content="#0080FF" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#090A0C" media="(prefers-color-scheme: dark)" />
    <meta name="msapplication-TileColor" content="#0080FF" />
    
    <!-- Preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    
    <!-- JSON-LD, site-wide (Organization only: Simplia has no premises open
         to the public, so no LocalBusiness). Service and FAQPage blocks are emitted per page
         by src/components/JsonLd.tsx next to the content they describe. -->

      "logo": "https://www.simpliaspain.com/icon-512.png",
      "email": "info@simpliaspain.com",

      "contactPoint": [
        {
          "@type": "ContactPoint",
          "telephone": "+34-601-755-607",
          "contactType": "sales",
          "areaServed": "ES",
          "availableLanguage": ["Spanish", "English"]
        },
        {
          "@type": "ContactPoint",
          "telephone": "+34-608-445-993",

        "https://www.youtube.com/@simplia-spain"
      ],

        {
          "@type": "VideoObject",

          "url": "https://www.youtube.com/watch?v=wOunqxmnvKY",

    <!-- Cookieless analytics (Umami Cloud). data-domains restricts tracking to
         the production host, so staging (simpliaspain.github.io) and localhost
         send nothing. The tracker writes no cookies or storage; it only reads
         localStorage "umami.disabled" as an opt-out. Disclosed in the privacy
         policy under "Analítica web". -->
    <script defer src="https://cloud.umami.is/script.js" data-website-id="722465f2-89ac-4464-b8d0-afbeb7e7dce2" data-domains="www.simpliaspain.com"></script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
