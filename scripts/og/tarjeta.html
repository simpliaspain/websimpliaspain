<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  :root {
    --ink: #0C0E12;
    --brand: #0080FF;
    --muted: #4D535B;
    --line: #DFE0DC;
    --soft: #F0F1EE;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1200px; height: 630px; }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: #fff;
    color: var(--ink);
    display: flex;
    align-items: center;
    gap: 56px;
    padding: 0 72px;
    -webkit-font-smoothing: antialiased;
  }
  .left { flex: 1 1 auto; min-width: 0; }
  .mark { display: flex; align-items: center; gap: 14px; margin-bottom: 30px; }
  .mark svg { width: 34px; height: 44px; display: block; }
  .mark span { font-size: 27px; font-weight: 700; letter-spacing: -0.02em; }

  h1 {
    font-size: 66px;
    font-weight: 700;
    line-height: 1.07;
    letter-spacing: -0.04em;
    max-width: 14ch;
    margin-bottom: 26px;
  }
  h1 em { font-style: normal; color: var(--brand); }

  p { font-size: 24px; line-height: 1.4; color: var(--muted); max-width: 26ch; }

  /* The message that is the whole argument, drawn the way the site draws it. */
  .bubble {
    flex: none;
    width: 352px;
    border: 1px solid var(--line);
    border-radius: 18px;
    padding: 16px 18px;
    background: #fff;
  }
  .who { display: flex; align-items: center; gap: 10px; margin-bottom: 12px; }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: #E4E6E9; color: var(--ink);
    font-size: 14px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
  }
  .who b { font-size: 15px; font-weight: 600; }
  .msg {
    background: #F2F3F5;
    border-radius: 14px 14px 14px 4px;
    padding: 11px 13px;
    font-size: 16px;
    line-height: 1.35;
  }
  .time { display: block; margin-top: 5px; font-size: 13px; color: var(--muted); }
  .reply {
    margin-top: 8px;
    background: #E3EFFC;
    border-radius: 14px 14px 4px 14px;
    padding: 11px 13px;
    font-size: 16px;
    line-height: 1.35;
  }
</style>
</head>
<body>
